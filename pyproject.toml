[project]
name = "streaming-forecast-system"
version = "0.1.0"
description = "Forecasting System Streaming Counts for EU Market"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "numpy>=1.26.0",
    "pydantic>=2.6.0",
    "kafka-python-ng>=2.2.2",
    "redis>=5.0.0",
    "psycopg2-binary>=2.9.9",
    "faker>=24.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "httpx2",
    "anyio>=4.3.0",
    "black>=26.5.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
